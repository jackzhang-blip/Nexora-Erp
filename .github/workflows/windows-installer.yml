name: Windows 内部安装包
on:
  workflow_dispatch:
  push:
    # 需求分支先完成 Windows 打包检查，避免只在合并后发现平台问题。
    branches: [main, 'codex/**']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r backend/requirements-dev.txt "pyinstaller>=6,<7"
      - name: 验证后端和桌面接口
        run: |
          $env:PYTHONPATH = 'backend'
          python -m pytest backend/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # PowerShell 不替原生命令展开通配符，显式枚举全部桌面测试，覆盖发现和重连行为。
          $desktopTests = @(Get-ChildItem tests -Filter '*.test.mjs' -File | ForEach-Object { $_.FullName })
          if ($desktopTests.Count -eq 0) { throw '未找到桌面单元测试' }
          node --experimental-strip-types --test $desktopTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: 生成 Windows 安装包
        run: npm run dist:win
      - name: 验证 Windows 安装包运行
        run: ./scripts/smoke-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-x64-internal
          path: release/*.exe
